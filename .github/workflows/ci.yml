name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (no ODBC driver needed; loader imports pyodbc lazily)
        run: pip install pandas python-dotenv pytest ruff
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
